  geosite-ai:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-!cn.mrs
    path: ./rule-providers/ai.mrs
  geosite-cn:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs
    path: ./rule-providers/cn.mrs
