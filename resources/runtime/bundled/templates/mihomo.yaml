mode: rule
log-level: info
ipv6: true
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 1-65535
    TLS:
      ports:
        - 1-65535
    QUIC:
      ports:
        - 1-65535
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-range6: fc00::/18
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver-policy:
    rule-set:geosite-cn:
      - https://223.5.5.5/dns-query
  fake-ip-filter: []
proxies: []
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - __WBOX_SELECTED__
      - DIRECT
  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - 节点选择
  - name: AI
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: Steam
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: Steam Download
    type: select
    proxies:
      - DIRECT
      - 节点选择
  - name: 国内
    type: select
    proxies:
      - DIRECT
      - 节点选择
rule-providers:
  anti-ad:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    url: https://anti-ad.net/clash.yaml
    path: ./rule-providers/anti-ad.yaml
  geosite-github:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.mrs
    path: ./rule-providers/github.mrs
  geoip-google:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/google.mrs
    path: ./rule-providers/google_ip.mrs
  geosite-google:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.mrs
    path: ./rule-providers/google.mrs
  geosite-microsoft:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/microsoft.mrs
    path: ./rule-providers/microsoft.mrs
  geoip-telegram:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.mrs
    path: ./rule-providers/telegram_ip.mrs
  geosite-telegram:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.mrs
    path: ./rule-providers/telegram.mrs
  geoip-twitter:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/twitter.mrs
    path: ./rule-providers/twitter_ip.mrs
  geosite-twitter:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
