plugins { id 'com.android.application' }
android {
    namespace 'com.wbox.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.wbox.app'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.5.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            storeFile file('../../signing/wbox-release.jks')
            storePassword System.getenv('WBOX_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'wbox'
            keyPassword System.getenv('WBOX_KEYSTORE_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { jniLibs.srcDirs = ['../../resources/cores/android']; assets.srcDirs = ['../../resources/ui-assets'] } }
    packagingOptions { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libmihomo.so', '**/libsingbox.so'] } }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { systemProperty 'wbox.root', rootProject.projectDir.parentFile.absolutePath } }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'org.yaml:snakeyaml:2.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
